use_default_settings: true

server:
  secret_key: "leadforge-searxng-dev-key-change-in-production"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false

search:
  safe_search: 0
  formats:
    - html
    - json

# Tier 🥇 — Search scraping engines (SearXNG aggregates Bing, Brave, DDG, Wikipedia)
# Brave and DuckDuckGo rate-limit hard under discovery load ("Suspended: too many
# requests" / timeouts), and Google answers with a CAPTCHA. Bing must stay enabled or a
# throttled instance returns zero results for every query.
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: google
    disabled: true
  - name: startpage
    disabled: true

ui:
  static_use_hash: true
